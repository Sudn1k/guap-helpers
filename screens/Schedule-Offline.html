<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Расписание · офлайн, нижняя неделя — прототип</title>
<link rel="icon" href="../img/app-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&amp;display=swap">
<link rel="stylesheet" href="../css/app.css">
</head>
<body class="proto">
<a class="proto-back" href="../index.html">← Все экраны</a>
<div class="device" id="app"></div>
<template id="tpl-Schedule-Offline">
<div style="width: 390px; height: 844px; overflow: hidden; background: #ffffff;">
<dc-import name="Schedule" view="день" week="нижняя" start-day="Чт" offline="{{ true }}" screen-height="844" hint-size="390px,844px"></dc-import>
</div>
</template>
<template id="tpl-Schedule">
<div style="width: 390px; height: {{screenHeight}}px; overflow: hidden; background: #ffffff; font-family: 'Roboto', Arial, sans-serif; color: #2B2F36; display: flex; flex-direction: column;">

<header style="flex-shrink: 0; display: flex; flex-direction: column; background: #ffffff;">
<sc-if value="{{offline}}" hint-placeholder-val="{{ false }}">
<div role="status" style="display: flex; align-items: center; gap: 8px; padding: 8px 20px; background: #FFF1E8; color: #9C3022; font-size: 13px; line-height: 18px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"></path><path d="M8.5 16.5a5 5 0 0 1 5.5-1"></path><path d="M5 12.5a10 10 0 0 1 3.5-2.3"></path><path d="M14 9.2a10 10 0 0 1 5 3.3"></path><path d="M12 20h.01"></path></svg>Нет сети · данные от 23 сентября, 08:12</div>
</sc-if>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 12px 6px 20px;">
<h1 style="margin: 0; font-size: 26px; line-height: 32px; font-weight: 700; color: #005AAA;">Расписание</h1>
<a href="Notifications.html" aria-label="Уведомления, 3 непрочитанных" style="position: relative; width: 44px; height: 44px; border-radius: 12px; background: #F4F7FB; color: #005AAA; display: flex; align-items: center; justify-content: center; text-decoration: none;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13.5V10a6 6 0 0 0-12 0v6l-1.5 2h15"></path><path d="M10 21h4"></path></svg><span style="position: absolute; top: 4px; right: 3px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: #E70F47; color: #ffffff; font-size: 11px; font-weight: 700; line-height: 14px; text-align: center; border: 2px solid #ffffff;">3</span></a>
</div>

<div style="display: flex; gap: 10px; padding: 6px 20px 0;">
<div role="group" aria-label="Вид расписания" style="display: flex; flex-grow: 1; flex-basis: 0; height: 44px; padding: 4px; box-sizing: border-box; border-radius: 12px; background: #F0F3F7;">
<button type="button" aria-pressed="{{isDay}}" onClick="{{showDay}}" style="flex-grow: 1; flex-basis: 0; border: none; border-radius: 9px; background: {{dayTabBg}}; color: {{dayTabColor}}; font-size: 15px; box-shadow: {{dayTabShadow}};">День</button>
<button type="button" aria-pressed="{{isWeek}}" onClick="{{showWeek}}" style="flex-grow: 1; flex-basis: 0; border: none; border-radius: 9px; background: {{weekTabBg}}; color: {{weekTabColor}}; font-size: 15px; box-shadow: {{weekTabShadow}};">Неделя</button>
</div>
<div role="group" aria-label="Неделя" style="display: flex; flex-grow: 1; flex-basis: 0; height: 44px; padding: 4px; box-sizing: border-box; border-radius: 12px; background: #F0F3F7;">
<button type="button" aria-pressed="{{isUp}}" onClick="{{pickUp}}" style="flex-grow: 1; flex-basis: 0; border: none; border-radius: 9px; background: {{upBg}}; color: {{upColor}}; font-size: 14px;">▲ Верхняя</button>
<button type="button" aria-pressed="{{isDown}}" onClick="{{pickDown}}" style="flex-grow: 1; flex-basis: 0; border: none; border-radius: 9px; background: {{downBg}}; color: {{downColor}}; font-size: 14px;">▼ Нижняя</button>
</div>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 20px 4px;">
<div style="font-size: 14px; color: #2B2F36;">{{rangeLabel}} <span style="font-weight: 300; color: #5E6673;">· {{rangeNote}}</span></div>
<sc-if value="{{online}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: center; gap: 4px; font-size: 12px; color: #5E6673;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Обновлено в 08:12</div>
</sc-if>
<sc-if value="{{offline}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 4px; font-size: 12px; color: #9C3022;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 0-8 8"></path><path d="M12 8v4l3 2"></path></svg>Копия от 08:12</div>
</sc-if>
</div>

<sc-if value="{{isDay}}" hint-placeholder-val="{{ true }}">
<div role="tablist" aria-label="День недели" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; padding: 8px 20px 12px; border-bottom: 1px solid #EEF1F5;">
<sc-for list="{{days}}" as="d" hint-placeholder-count="6">
<button type="button" role="tab" aria-selected="{{d.selected}}" aria-label="{{d.full}}" onClick="{{d.pick}}" style="height: 60px; border: {{d.border}}; border-radius: 14px; background: {{d.bg}}; color: {{d.color}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0;"><span style="font-size: 12px; opacity: 0.9;">{{d.short}}</span><span style="font-size: 18px; font-weight: 400;">{{d.num}}</span><span style="width: 4px; height: 4px; border-radius: 2px; background: {{d.dot}};"></span></button>
</sc-for>
</div>
</sc-if>
</header>

<main style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 12px;">

<sc-if value="{{isDay}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; align-items: center; gap: 10px;"><div style="width: 4px; height: 22px; border-radius: 2px; background: linear-gradient(to top, #005AAA, #AB3A8D);"></div><h2 style="margin: 0; font-size: 20px; line-height: 26px; font-weight: 700; color: #005AAA;">{{dayTitle}}</h2><span style="font-size: 14px; font-weight: 300; color: #5E6673;">{{dayCount}}</span></div>
<sc-for list="{{dayLessons}}" as="l" hint-placeholder-count="3">
<div style="display: flex; gap: 14px; padding: 16px; border-radius: 16px; background: {{l.cardBg}}; border: {{l.cardBorder}}; box-shadow: {{l.cardShadow}};">
<div style="width: 46px; flex-shrink: 0; display: flex; flex-direction: column; gap: 2px;"><div style="font-size: 16px; font-weight: 400; color: {{l.timeColor}};">{{l.start}}</div><div style="font-size: 14px; font-weight: 300; color: #5E6673;">{{l.end}}</div><div style="margin-top: 6px; font-size: 12px; color: #5E6673;">{{l.n}}-я пара</div></div>
<div style="width: 1px; align-self: stretch; background: {{l.divider}};"></div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0;">
<div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;"><span style="display: inline-flex; align-items: center; justify-content: center; min-width: 32px; height: 24px; padding: 0 8px; box-sizing: border-box; border-radius: 6px; background: {{l.typeBg}}; color: {{l.typeColor}}; font-size: 13px;">{{l.type}}</span><sc-if value="{{l.isNow}}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #005AAA;"><span style="width: 8px; height: 8px; border-radius: 4px; background: #005AAA;"></span>Идёт сейчас</span></sc-if><sc-if value="{{l.onlyThisWeek}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: #5E6673;">{{l.weekMark}}</span></sc-if></div>
<div style="font-size: 17px; line-height: 22px; font-weight: 400;">{{l.subj}}</div>
<div style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 300; color: #4A515C;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5E6673" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 7.5a3 3 0 1 0-1 2.2"></path><path d="M5 20a7 7 0 0 1 14 0"></path></svg>{{l.teacher}}</div>
<div style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 300; color: #4A515C;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5E6673" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 2.5-1.3 5-2.8 7"></path><circle cx="12" cy="10" r="2.5"></circle></svg>{{l.room}} · {{l.bld}}</div>
</div>
</div>
</sc-for>
<sc-if value="{{dayEmpty}}" hint-placeholder-val="{{ false }}">
<div style="padding: 32px 24px; border-radius: 16px; background: #F4F7FB; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;">
<span style="width: 56px; height: 56px; border-radius: 28px; background: #ffffff; color: #005AAA; display: flex; align-items: center; justify-content: center;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 6.2L20 11l-6.2 1.8L12 19l-1.8-6.2L4 11l6.2-1.8z"></path></svg></span>
<div style="font-size: 18px; font-weight: 400; color: #005AAA;">Пар нет</div>
<div style="font-size: 14px; line-height: 20px; font-weight: 300; color: #4A515C;">Свободный день. Загляните в задания — может, есть что доделать.</div>
</div>
</sc-if>
</div>
</sc-if>

<sc-if value="{{isWeek}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 24px;">
<sc-for list="{{weekDays}}" as="wd" hint-placeholder-count="6">
<section style="display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; align-items: center; gap: 10px;"><div style="width: 4px; height: 20px; border-radius: 2px; background: linear-gradient(to top, #005AAA, #AB3A8D);"></div><h2 style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 700; color: #005AAA;">{{wd.full}}</h2><span style="font-size: 14px; font-weight: 300; color: #5E6673;">{{wd.date}}</span><sc-if value="{{wd.isToday}}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 999px; background: #EAF2FB; color: #005AAA; font-size: 12px;">сегодня</span></sc-if></div>
<sc-if value="{{wd.hasLessons}}" hint-placeholder-val="{{ true }}">
<div style="border-radius: 16px; background: #ffffff; box-shadow: 0 1px 2px rgba(0, 40, 90, 0.06), 0 4px 14px rgba(0, 40, 90, 0.06); display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0;">
<sc-for list="{{wd.lessons}}" as="l" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: {{l.rowBorder}}; background: {{l.rowBg}};">
<div style="width: 46px; flex-shrink: 0; display: flex; flex-direction: column;"><span style="font-size: 15px; font-weight: 400; color: {{l.timeColor}};">{{l.start}}</span><span style="font-size: 12px; font-weight: 300; color: #5E6673;">{{l.end}}</span></div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0;"><div style="font-size: 16px; line-height: 21px;">{{l.subj}}</div><div style="font-size: 13px; font-weight: 300; color: #5E6673;">{{l.room}} · {{l.bld}}</div></div>
<span style="flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; min-width: 32px; height: 24px; padding: 0 8px; box-sizing: border-box; border-radius: 6px; background: {{l.typeBg}}; color: {{l.typeColor}}; font-size: 13px;">{{l.type}}</span>
</div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{wd.isEmpty}}" hint-placeholder-val="{{ false }}">
<div style="padding: 14px 16px; border-radius: 16px; background: #F4F7FB; font-size: 14px; font-weight: 300; color: #4A515C;">Пар нет</div>
</sc-if>
</section>
</sc-for>
</div>
</sc-if>

</main>

<nav aria-label="Основная навигация" style="flex-shrink: 0; height: 84px; box-sizing: border-box; padding: 6px 4px 20px; display: flex; background: #ffffff; border-top: 1px solid #E3E8EF; box-shadow: 0 -2px 16px rgba(0, 40, 90, 0.06);">
<a href="Main.html" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5E6673; min-height: 52px;"><span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"></path><path d="M6 13.5V20h4v-5h4v5h4v-6.5"></path></svg></span><span style="font-size: 12px; font-weight: 400;">Главная</span></a>
<a href="#" aria-current="page" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #005AAA; min-height: 52px;"><span style="width: 56px; height: 30px; border-radius: 15px; background: #EAF2FB; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12.5V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h8"></path><path d="M17.5 20h.5a2 2 0 0 0 2-2v-1.5"></path><path d="M8 3v4M16 3v4M4 10h16"></path></svg></span><span style="font-size: 12px; font-weight: 400;">Расписание</span></a>
<a href="Tasks.html" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5E6673; min-height: 52px;"><span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7l2 2 3.5-3.5"></path><path d="M4 16.5l2 2L9.5 15"></path><path d="M13 7.5h7M13 17h7"></path></svg></span><span style="font-size: 12px; font-weight: 400;">Задания</span></a>
<a href="Topics.html" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5E6673; min-height: 52px;"><span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 14.5V21l-6-4-6 4V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v5.5"></path></svg></span><span style="font-size: 12px; font-weight: 400;">Темы</span></a>
<a href="More.html" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5E6673; min-height: 52px;"><span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1.5"></rect><rect x="14" y="4" width="6" height="6" rx="1.5"></rect><rect x="4" y="14" width="6" height="6" rx="1.5"></rect><path d="M14 17h6M17 14v6"></path></svg></span><span style="font-size: 12px; font-weight: 400;">Ещё</span></a>
</nav>
</div>
</template>
<script src="../js/dc-lite.js"></script>
<script src="../js/components/Schedule-Offline.js"></script>
<script src="../js/components/Schedule.js"></script>
<script>DCLite.mount("Schedule-Offline", document.getElementById('app'), {});</script>
</body>
</html>
