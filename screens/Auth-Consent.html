<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Согласие на обработку данных — прототип</title>
<link rel="icon" href="../img/app-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&amp;display=swap">
<link rel="stylesheet" href="../css/app.css">
</head>
<body class="proto">
<a class="proto-back" href="../index.html">← Все экраны</a>
<div class="device" id="app"></div>
<template id="tpl-Auth-Consent">
<div style="width: 390px; height: 844px; overflow: hidden; background: #ffffff; font-family: 'Roboto', Arial, sans-serif; color: #2B2F36; display: flex; flex-direction: column;">

<div style="flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 8px 20px 0 8px;">
<a href="Auth-Login.html" aria-label="Назад" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #005AAA;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<div style="display: flex; align-items: center; gap: 8px;"><span style="font-size: 13px; color: #5E6673;">Шаг 1 из 2</span><span style="display: flex; gap: 4px;"><span style="width: 20px; height: 4px; border-radius: 2px; background: #005AAA;"></span><span style="width: 20px; height: 4px; border-radius: 2px; background: #E3E8EF;"></span></span></div>
</div>

<div style="flex-shrink: 0; padding: 12px 20px 16px; display: flex; flex-direction: column; gap: 8px;">
<h1 style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 700; color: #005AAA;">Согласие на обработку персональных данных</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; font-weight: 300;">Чтобы приложение работало, нам нужно немного ваших данных. Вот какие и зачем.</p>
</div>

<div style="flex-grow: 1; min-height: 0; position: relative; margin: 0 20px; border-radius: 16px; background: #F4F7FB;">
<div tabindex="0" aria-label="Текст согласия" style="position: absolute; inset: 0; overflow-y: auto; padding: 16px 16px 40px; display: flex; flex-direction: column; gap: 14px; font-size: 14px; line-height: 20px; font-weight: 300;">
<div style="display: flex; flex-direction: column; gap: 8px;">
<div style="font-size: 15px; font-weight: 400; color: #005AAA;">Какие данные мы храним</div>
<div style="display: flex; gap: 10px;"><span style="width: 6px; height: 6px; border-radius: 3px; background: #005AAA; margin-top: 7px; flex-shrink: 0;"></span><span><span style="font-weight: 400;">ФИО</span> — чтобы понимать, кто есть кто, и для броней тем</span></div>
<div style="display: flex; gap: 10px;"><span style="width: 6px; height: 6px; border-radius: 3px; background: #005AAA; margin-top: 7px; flex-shrink: 0;"></span><span><span style="font-weight: 400;">ID аккаунта VK или Яндекс</span> — для входа</span></div>
<div style="display: flex; gap: 10px;"><span style="width: 6px; height: 6px; border-radius: 3px; background: #005AAA; margin-top: 7px; flex-shrink: 0;"></span><span><span style="font-weight: 400;">Дата рождения и пол</span> — по желанию, для поздравлений</span></div>
<div style="display: flex; gap: 10px;"><span style="width: 6px; height: 6px; border-radius: 3px; background: #005AAA; margin-top: 7px; flex-shrink: 0;"></span><span><span style="font-weight: 400;">Подписка на push</span> — чтобы присылать уведомления</span></div>
<div style="display: flex; gap: 10px;"><span style="width: 6px; height: 6px; border-radius: 3px; background: #005AAA; margin-top: 7px; flex-shrink: 0;"></span><span><span style="font-weight: 400;">Брони тем и отметки заданий</span> — для работы функций</span></div>
<div style="display: flex; gap: 10px;"><span style="width: 6px; height: 6px; border-radius: 3px; background: #005AAA; margin-top: 7px; flex-shrink: 0;"></span><span><span style="font-weight: 400;">IP-адрес в логах</span> — 7 дней, для безопасности</span></div>
<div style="color: #4A515C;">Email и телефон не сохраняем, даже если их передаёт VK или Яндекс.</div>
</div>
<div style="height: 1px; background: #E3E8EF;"></div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<div style="font-size: 15px; font-weight: 400; color: #005AAA;">Кто видит</div>
<div>Ваше ФИО видят одногруппники и преподаватель — в списке броней тем. Отметки о выполненных заданиях видите только вы.</div>
</div>
<div style="height: 1px; background: #E3E8EF;"></div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<div style="font-size: 15px; font-weight: 400; color: #005AAA;">Где и сколько хранятся</div>
<div>На серверах в России, хостинг — [название провайдера]. Согласие действует, пока вы его не отзовёте.</div>
</div>
<div style="height: 1px; background: #E3E8EF;"></div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<div style="font-size: 15px; font-weight: 400; color: #005AAA;">Как отозвать</div>
<div>Кнопка «Удалить аккаунт и мои данные» в профиле или письмо оператору.</div>
</div>
<div style="height: 1px; background: #E3E8EF;"></div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<div style="font-size: 15px; font-weight: 400; color: #005AAA;">Оператор</div>
<div>[ФИО оператора], [email для связи]. Цель обработки — работа приложения для учебной группы.</div>
</div>
</div>
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 40px; border-radius: 0 0 16px 16px; background: linear-gradient(to bottom, rgba(244, 247, 251, 0), #F4F7FB);"></div>
</div>

<div style="flex-shrink: 0; padding: 12px 20px 0;">
<a href="#" style="height: 44px; display: inline-flex; align-items: center; gap: 8px; font-size: 15px; color: #005AAA; text-decoration: underline; text-underline-offset: 3px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12.5V19a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v1"></path><path d="M14 3v5h5"></path></svg>Политика обработки персональных данных</a>
</div>

<div style="flex-shrink: 0; padding: 8px 20px 28px; display: flex; flex-direction: column; gap: 14px; background: #ffffff;">
<label style="display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border-radius: 12px; border: 1.5px solid {{boxBorder}}; background: {{boxBg}}; cursor: pointer;">
<input type="checkbox" checked="{{agreed}}" onChange="{{toggle}}" style="position: absolute; opacity: 0; width: 1px; height: 1px;">
<sc-if value="{{agreed}}" hint-placeholder-val="{{ false }}">
<span style="flex-shrink: 0; width: 24px; height: 24px; border-radius: 6px; background: #005AAA; color: #ffffff; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
</sc-if>
<sc-if value="{{notAgreed}}" hint-placeholder-val="{{ true }}">
<span style="flex-shrink: 0; width: 24px; height: 24px; border: 2px solid #5E6673; border-radius: 6px; box-sizing: border-box; background: #ffffff;"></span>
</sc-if>
<span style="font-size: 15px; line-height: 22px; font-weight: 300;">Я прочитал(а) и даю согласие на обработку моих персональных данных</span>
</label>
<sc-if value="{{agreed}}" hint-placeholder-val="{{ false }}">
<a href="Auth-PickSelf.html" style="height: 52px; border-radius: 12px; background: #005AAA; color: #ffffff; font-size: 17px; font-weight: 400; display: flex; align-items: center; justify-content: center; text-decoration: none;">Продолжить</a>
</sc-if>
<sc-if value="{{notAgreed}}" hint-placeholder-val="{{ true }}">
<button type="button" disabled style="height: 52px; border: none; border-radius: 12px; background: #E3E8EF; color: #7A8391; font-size: 17px; font-weight: 400;">Продолжить</button>
</sc-if>
</div>

</div>
</template>
<script src="../js/dc-lite.js"></script>
<script src="../js/components/Auth-Consent.js"></script>
<script>DCLite.mount("Auth-Consent", document.getElementById('app'), {});</script>
</body>
</html>
