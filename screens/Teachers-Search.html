<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Преподаватели · поиск по предмету — прототип</title>
<link rel="icon" href="../img/app-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&amp;display=swap">
<link rel="stylesheet" href="../css/app.css">
</head>
<body class="proto">
<a class="proto-back" href="../index.html">← Все экраны</a>
<div class="device" id="app"></div>
<template id="tpl-Teachers-Search">
<div style="width: 390px; height: 844px; overflow: hidden; background: #ffffff;">
<dc-import name="Teachers" query="базы" screen-height="844" hint-size="390px,844px"></dc-import>
</div>
</template>
<template id="tpl-Teachers">
<div style="width: 390px; height: {{screenHeight}}px; overflow: hidden; background: #ffffff; font-family: 'Roboto', Arial, sans-serif; color: #2B2F36; display: flex; flex-direction: column;">

<header style="flex-shrink: 0; display: flex; flex-direction: column; background: #ffffff; border-bottom: 1px solid #EEF1F5;">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 12px 0 8px;">
<a href="More.html" style="height: 44px; padding: 0 8px 0 0; display: inline-flex; align-items: center; gap: 2px; color: #005AAA; font-size: 16px; text-decoration: none;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Ещё</a>
<a href="Notifications.html" aria-label="Уведомления, 3 непрочитанных" style="position: relative; width: 44px; height: 44px; border-radius: 12px; background: #F4F7FB; color: #005AAA; display: flex; align-items: center; justify-content: center; text-decoration: none;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13.5V10a6 6 0 0 0-12 0v6l-1.5 2h15"></path><path d="M10 21h4"></path></svg><span style="position: absolute; top: 4px; right: 3px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: #E70F47; color: #ffffff; font-size: 11px; font-weight: 700; line-height: 14px; text-align: center; border: 2px solid #ffffff;">3</span></a>
</div>
<h1 style="margin: 0; padding: 4px 20px 12px; font-size: 26px; line-height: 32px; font-weight: 700; color: #005AAA;">Преподаватели</h1>
<div style="padding: 0 20px 10px;">
<label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 6px 0 14px; box-sizing: border-box; border-radius: 12px; background: #F4F7FB; border: 1px solid #E3E8EF; color: #5E6673;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 11A6.5 6.5 0 1 0 11 17.5"></path><path d="M16 16l4 4"></path></svg><input type="search" value="{{q}}" onInput="{{onSearch}}" placeholder="Фамилия или предмет" aria-label="Поиск по фамилии или предмету" style="flex-grow: 1; min-width: 0; border: none; background: transparent; font-family: inherit; font-size: 16px; font-weight: 300; color: #2B2F36; outline: none;">
<sc-if value="{{hasQuery}}" hint-placeholder-val="{{ false }}"><button type="button" aria-label="Очистить поиск" onClick="{{clearSearch}}" style="width: 36px; height: 36px; border: none; border-radius: 10px; background: transparent; color: #5E6673; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6l-4.5 4.5M10.5 13.5 6 18"></path></svg></button></sc-if>
</label>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 20px 12px;">
<span style="font-size: 13px; color: #5E6673;">{{countLabel}}</span>
<div role="group" aria-label="Сортировка" style="display: flex; width: 220px; height: 40px; padding: 4px; box-sizing: border-box; border-radius: 12px; background: #F0F3F7;">
<button type="button" aria-pressed="{{byName}}" onClick="{{sortName}}" style="flex-grow: 1; flex-basis: 0; border: none; border-radius: 9px; background: {{nameBg}}; color: {{nameColor}}; font-size: 14px; box-shadow: {{nameShadow}};">Фамилия</button>
<button type="button" aria-pressed="{{byDiff}}" onClick="{{sortDiff}}" style="flex-grow: 1; flex-basis: 0; border: none; border-radius: 9px; background: {{diffBg}}; color: {{diffColor}}; font-size: 14px; box-shadow: {{diffShadow}};">Сложность</button>
</div>
</div>
</header>

<main style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 14px 20px 24px; display: flex; flex-direction: column; gap: 10px;">
<sc-for list="{{list}}" as="t" hint-placeholder-count="5">
<a href="TeacherDetail.html" style="display: flex; align-items: flex-start; gap: 12px; padding: 14px 14px 14px 14px; border-radius: 16px; background: #ffffff; box-shadow: 0 1px 2px rgba(0, 40, 90, 0.06), 0 4px 14px rgba(0, 40, 90, 0.06); text-decoration: none; color: inherit;">
<span style="width: 44px; height: 44px; border-radius: 22px; background: #EAF2FB; color: #005AAA; font-size: 15px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">{{t.initials}}</span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 16px; line-height: 21px; font-weight: 400;">{{t.name}}</span>
<span style="font-size: 14px; line-height: 19px; font-weight: 300; color: #4A515C;">{{t.subjects}}</span>
<span style="font-size: 12px; line-height: 16px; color: #5E6673;">Также: {{t.aka}}</span>
</span>
<span style="flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; background: {{t.badgeBg}}; color: {{t.badgeColor}}; font-size: 13px;"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{t.badgeDot}};"></span>{{t.diff}}</span>
</a>
</sc-for>

<sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
<div style="padding: 32px 24px; border-radius: 16px; background: #F4F7FB; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;">
<span style="width: 56px; height: 56px; border-radius: 28px; background: #ffffff; color: #005AAA; display: flex; align-items: center; justify-content: center;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 11A6.5 6.5 0 1 0 11 17.5"></path><path d="M16 16l4 4"></path></svg></span>
<div style="font-size: 18px; font-weight: 400; color: #005AAA;">Никого не нашли</div>
<div style="font-size: 14px; line-height: 20px; font-weight: 300; color: #4A515C;">По запросу «{{q}}» ничего нет. Попробуйте фамилию без инициалов или название предмета.</div>
<button type="button" onClick="{{clearSearch}}" style="height: 44px; padding: 0 16px; border: none; border-radius: 12px; background: #EAF2FB; color: #005AAA; font-size: 15px;">Сбросить поиск</button>
</div>
</sc-if>

<div style="display: flex; align-items: flex-start; gap: 10px; margin-top: 8px; padding: 12px 14px; border-radius: 12px; background: #F4F7FB; font-size: 13px; line-height: 18px; color: #4A515C;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E6673" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 0;"><path d="M20 12a8 8 0 1 0-8 8"></path><path d="M12 11v5"></path><path d="M12 8h.01"></path></svg>Субъективное мнение студентов, не официальная информация</div>
</main>

<nav aria-label="Основная навигация" style="flex-shrink: 0; height: 84px; box-sizing: border-box; padding: 6px 4px 20px; display: flex; background: #ffffff; border-top: 1px solid #E3E8EF; box-shadow: 0 -2px 16px rgba(0, 40, 90, 0.06);">
<a href="Main.html" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5E6673; min-height: 52px;"><span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"></path><path d="M6 13.5V20h4v-5h4v5h4v-6.5"></path></svg></span><span style="font-size: 12px; font-weight: 400;">Главная</span></a>
<a href="Schedule.html" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5E6673; min-height: 52px;"><span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12.5V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h8"></path><path d="M17.5 20h.5a2 2 0 0 0 2-2v-1.5"></path><path d="M8 3v4M16 3v4M4 10h16"></path></svg></span><span style="font-size: 12px; font-weight: 400;">Расписание</span></a>
<a href="Tasks.html" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5E6673; min-height: 52px;"><span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7l2 2 3.5-3.5"></path><path d="M4 16.5l2 2L9.5 15"></path><path d="M13 7.5h7M13 17h7"></path></svg></span><span style="font-size: 12px; font-weight: 400;">Задания</span></a>
<a href="Topics.html" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5E6673; min-height: 52px;"><span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 14.5V21l-6-4-6 4V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v5.5"></path></svg></span><span style="font-size: 12px; font-weight: 400;">Темы</span></a>
<a href="More.html" aria-current="page" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #005AAA; min-height: 52px;"><span style="width: 56px; height: 30px; border-radius: 15px; background: #EAF2FB; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1.5"></rect><rect x="14" y="4" width="6" height="6" rx="1.5"></rect><rect x="4" y="14" width="6" height="6" rx="1.5"></rect><path d="M14 17h6M17 14v6"></path></svg></span><span style="font-size: 12px; font-weight: 400;">Ещё</span></a>
</nav>
</div>
</template>
<script src="../js/dc-lite.js"></script>
<script src="../js/components/Teachers-Search.js"></script>
<script src="../js/components/Teachers.js"></script>
<script>DCLite.mount("Teachers-Search", document.getElementById('app'), {});</script>
</body>
</html>
