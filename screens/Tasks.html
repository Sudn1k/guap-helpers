<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Задания · актуальные — прототип</title>
<link rel="icon" href="../img/app-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&amp;display=swap">
<link rel="stylesheet" href="../css/app.css">
</head>
<body class="proto">
<a class="proto-back" href="../index.html">← Все экраны</a>
<div class="device" id="app"></div>
<template id="tpl-Tasks">
<div style="width: 390px; height: {{screenHeight}}px; overflow: hidden; background: #ffffff; font-family: 'Roboto', Arial, sans-serif; color: #2B2F36; display: flex; flex-direction: column;">

<header style="flex-shrink: 0; display: flex; flex-direction: column; background: #ffffff; border-bottom: 1px solid #EEF1F5;">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 12px 6px 20px;">
<h1 style="margin: 0; font-size: 26px; line-height: 32px; font-weight: 700; color: #005AAA;">Задания</h1>
<a href="Notifications.html" aria-label="Уведомления, 3 непрочитанных" style="position: relative; width: 44px; height: 44px; border-radius: 12px; background: #F4F7FB; color: #005AAA; display: flex; align-items: center; justify-content: center; text-decoration: none;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13.5V10a6 6 0 0 0-12 0v6l-1.5 2h15"></path><path d="M10 21h4"></path></svg><span style="position: absolute; top: 4px; right: 3px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: #E70F47; color: #ffffff; font-size: 11px; font-weight: 700; line-height: 14px; text-align: center; border: 2px solid #ffffff;">3</span></a>
</div>

<div style="padding: 6px 20px 4px;">
<div role="tablist" aria-label="Раздел" style="display: flex; height: 44px; padding: 4px; box-sizing: border-box; border-radius: 12px; background: #F0F3F7;">
<button type="button" role="tab" aria-selected="{{isActive}}" onClick="{{showActive}}" style="flex-grow: 1; flex-basis: 0; border: none; border-radius: 9px; background: {{activeTabBg}}; color: {{activeTabColor}}; font-size: 15px; box-shadow: {{activeTabShadow}}; display: flex; align-items: center; justify-content: center; gap: 6px;">Актуальные<span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 10px; background: {{activeCountBg}}; color: {{activeCountColor}}; font-size: 12px; line-height: 20px;">{{openCount}}</span></button>
<button type="button" role="tab" aria-selected="{{isArchive}}" onClick="{{showArchive}}" style="flex-grow: 1; flex-basis: 0; border: none; border-radius: 9px; background: {{archiveTabBg}}; color: {{archiveTabColor}}; font-size: 15px; box-shadow: {{archiveTabShadow}};">Архив</button>
</div>
</div>

<div role="group" aria-label="Фильтр по предмету" style="display: flex; gap: 8px; overflow-x: auto; padding: 4px 20px 8px; scrollbar-width: none;">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
<button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="flex-shrink: 0; height: 36px; margin: 4px 0; padding: 0 16px; border: {{c.border}}; border-radius: 999px; background: {{c.bg}}; color: {{c.color}}; font-size: 14px; white-space: nowrap;">{{c.label}}</button>
</sc-for>
</div>
</header>

<main style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 24px;">

<sc-if value="{{loading}}" hint-placeholder-val="{{ false }}">
<div aria-busy="true" aria-label="Загрузка заданий" style="display: flex; flex-direction: column; gap: 12px;">
<div style="height: 20px; width: 120px; border-radius: 8px; background: #EDF1F6;"></div>
<div style="border-radius: 16px; background: #ffffff; box-shadow: 0 1px 2px rgba(0, 40, 90, 0.06), 0 4px 14px rgba(0, 40, 90, 0.06); display: flex; flex-direction: column;">
<div style="display: flex; align-items: center; gap: 14px; padding: 16px;"><div style="width: 24px; height: 24px; border-radius: 12px; background: #EDF1F6;"></div><div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px;"><div style="height: 12px; width: 40%; border-radius: 6px; background: #EDF1F6;"></div><div style="height: 16px; width: 80%; border-radius: 8px; background: #E3E9F0;"></div></div><div style="width: 64px; height: 26px; border-radius: 13px; background: #EDF1F6;"></div></div>
<div style="height: 1px; background: #EEF1F5; margin-left: 54px;"></div>
<div style="display: flex; align-items: center; gap: 14px; padding: 16px;"><div style="width: 24px; height: 24px; border-radius: 12px; background: #EDF1F6;"></div><div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px;"><div style="height: 12px; width: 50%; border-radius: 6px; background: #EDF1F6;"></div><div style="height: 16px; width: 65%; border-radius: 8px; background: #E3E9F0;"></div></div><div style="width: 64px; height: 26px; border-radius: 13px; background: #EDF1F6;"></div></div>
</div>
<div style="height: 20px; width: 160px; border-radius: 8px; background: #EDF1F6; margin-top: 12px;"></div>
<div style="border-radius: 16px; background: #ffffff; box-shadow: 0 1px 2px rgba(0, 40, 90, 0.06), 0 4px 14px rgba(0, 40, 90, 0.06); display: flex; flex-direction: column;">
<div style="display: flex; align-items: center; gap: 14px; padding: 16px;"><div style="width: 24px; height: 24px; border-radius: 12px; background: #EDF1F6;"></div><div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px;"><div style="height: 12px; width: 35%; border-radius: 6px; background: #EDF1F6;"></div><div style="height: 16px; width: 75%; border-radius: 8px; background: #E3E9F0;"></div></div><div style="width: 64px; height: 26px; border-radius: 13px; background: #EDF1F6;"></div></div>
<div style="height: 1px; background: #EEF1F5; margin-left: 54px;"></div>
<div style="display: flex; align-items: center; gap: 14px; padding: 16px;"><div style="width: 24px; height: 24px; border-radius: 12px; background: #EDF1F6;"></div><div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px;"><div style="height: 12px; width: 45%; border-radius: 6px; background: #EDF1F6;"></div><div style="height: 16px; width: 60%; border-radius: 8px; background: #E3E9F0;"></div></div><div style="width: 64px; height: 26px; border-radius: 13px; background: #EDF1F6;"></div></div>
</div>
</div>
</sc-if>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<section style="display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; align-items: center; gap: 10px;"><div style="width: 4px; height: 20px; border-radius: 2px; background: linear-gradient(to top, #005AAA, #AB3A8D);"></div><h2 style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 700; color: #005AAA;">{{g.title}}</h2><span style="font-size: 14px; font-weight: 300; color: #5E6673;">{{g.note}}</span></div>
<div style="border-radius: 16px; background: #ffffff; box-shadow: 0 1px 2px rgba(0, 40, 90, 0.06), 0 4px 14px rgba(0, 40, 90, 0.06); display: flex; flex-direction: column; padding: 4px 0;">
<sc-for list="{{g.items}}" as="t" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 2px; padding: 6px 12px 6px 6px; border-top: {{t.rowBorder}};">
<sc-if value="{{t.canCheck}}" hint-placeholder-val="{{ true }}">
<button type="button" aria-label="{{t.checkLabel}}" aria-pressed="{{t.done}}" onClick="{{t.toggle}}" style="flex-shrink: 0; width: 44px; height: 44px; border: none; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; color: #ffffff;"><span style="width: 24px; height: 24px; border-radius: 12px; box-sizing: border-box; border: {{t.checkBorder}}; background: {{t.checkBg}}; display: flex; align-items: center; justify-content: center;"><sc-if value="{{t.done}}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if></span></button>
</sc-if>
<sc-if value="{{t.isMissed}}" hint-placeholder-val="{{ false }}">
<span aria-hidden="true" style="flex-shrink: 0; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #E70F47;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 0-8 8"></path><path d="M12 8v4.5"></path><path d="M12 16h.01"></path></svg></span>
</sc-if>
<a href="Tasks-Detail.html" style="flex-grow: 1; min-width: 0; min-height: 56px; display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; padding: 4px 0;">
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
<span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #5E6673;">{{t.subj}}<sc-if value="{{t.hasFile}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="есть файл"><path d="M19 12.5V19a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v1"></path><path d="M14 3v5h5"></path></svg></sc-if><sc-if value="{{t.hasLink}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="есть ссылка"><path d="M10 14l3.5-3.5"></path><path d="M9 7.5l2-2a4 4 0 0 1 5.5 5.5l-2 2"></path><path d="M15 16.5l-2 2A4 4 0 0 1 7.5 13l2-2"></path></svg></sc-if></span>
<span style="font-size: 16px; line-height: 21px; font-weight: {{t.titleWeight}}; color: {{t.titleColor}}; text-decoration: {{t.titleDeco}};">{{t.title}}</span>
</span>
<span style="flex-shrink: 0; display: inline-flex; align-items: center; height: 28px; padding: 0 10px; border-radius: 999px; background: {{t.pillBg}}; color: {{t.pillColor}}; font-size: 13px; white-space: nowrap;">{{t.pill}}</span>
</a>
</div>
</sc-for>
</div>
</section>
</sc-for>

<sc-if value="{{filteredEmpty}}" hint-placeholder-val="{{ false }}">
<div style="padding: 28px 24px; border-radius: 16px; background: #F4F7FB; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;">
<div style="font-size: 17px; font-weight: 400; color: #005AAA;">По этому предмету пусто</div>
<div style="font-size: 14px; line-height: 20px; font-weight: 300; color: #4A515C;">Заданий по предмету «{{subjectLabel}}» сейчас нет.</div>
<button type="button" onClick="{{resetFilter}}" style="height: 44px; padding: 0 16px; border: none; border-radius: 12px; background: #EAF2FB; color: #005AAA; font-size: 15px;">Показать все предметы</button>
</div>
</sc-if>

<sc-if value="{{allEmpty}}" hint-placeholder-val="{{ false }}">
<div style="margin-top: 40px; padding: 36px 24px; border-radius: 16px; background: #F4F7FB; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;">
<span style="width: 64px; height: 64px; border-radius: 32px; background: #ffffff; color: #005AAA; display: flex; align-items: center; justify-content: center;"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7l2 2 3.5-3.5"></path><path d="M4 16.5l2 2L9.5 15"></path><path d="M13 7.5h7M13 17h7"></path></svg></span>
<div style="font-size: 20px; font-weight: 400; color: #005AAA;">Заданий нет</div>
<div style="font-size: 15px; line-height: 22px; font-weight: 300; color: #4A515C;">Можно выдохнуть. Когда появится новое задание, придёт уведомление.</div>
</div>
</sc-if>

<sc-if value="{{showArchiveNote}}" hint-placeholder-val="{{ false }}">
<div style="font-size: 13px; line-height: 18px; font-weight: 300; color: #5E6673; text-align: center; padding: 0 16px;">Задания попадают в архив, когда проходит дедлайн. Отметки «выполнено» видите только вы.</div>
</sc-if>
</main>

<nav aria-label="Основная навигация" style="flex-shrink: 0; height: 84px; box-sizing: border-box; padding: 6px 4px 20px; display: flex; background: #ffffff; border-top: 1px solid #E3E8EF; box-shadow: 0 -2px 16px rgba(0, 40, 90, 0.06);">
<a href="Main.html" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5E6673; min-height: 52px;"><span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"></path><path d="M6 13.5V20h4v-5h4v5h4v-6.5"></path></svg></span><span style="font-size: 12px; font-weight: 400;">Главная</span></a>
<a href="Schedule.html" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5E6673; min-height: 52px;"><span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12.5V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h8"></path><path d="M17.5 20h.5a2 2 0 0 0 2-2v-1.5"></path><path d="M8 3v4M16 3v4M4 10h16"></path></svg></span><span style="font-size: 12px; font-weight: 400;">Расписание</span></a>
<a href="#" aria-current="page" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #005AAA; min-height: 52px;"><span style="width: 56px; height: 30px; border-radius: 15px; background: #EAF2FB; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7l2 2 3.5-3.5"></path><path d="M4 16.5l2 2L9.5 15"></path><path d="M13 7.5h7M13 17h7"></path></svg></span><span style="font-size: 12px; font-weight: 400;">Задания</span></a>
<a href="Topics.html" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5E6673; min-height: 52px;"><span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 14.5V21l-6-4-6 4V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v5.5"></path></svg></span><span style="font-size: 12px; font-weight: 400;">Темы</span></a>
<a href="More.html" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5E6673; min-height: 52px;"><span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1.5"></rect><rect x="14" y="4" width="6" height="6" rx="1.5"></rect><rect x="4" y="14" width="6" height="6" rx="1.5"></rect><path d="M14 17h6M17 14v6"></path></svg></span><span style="font-size: 12px; font-weight: 400;">Ещё</span></a>
</nav>
</div>
</template>
<script src="../js/dc-lite.js"></script>
<script src="../js/components/Tasks.js"></script>
<script>DCLite.mount("Tasks", document.getElementById('app'), {});</script>
</body>
</html>
