<button type="button" aria-label="Поделиться" style="width: 44px; height: 44px; border: none; border-radius: 12px; background: #F4F7FB; color: #005AAA; display: flex; align-items: center; justify-content: center; padding: 0;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 14V3"></path><path d="M8 7l4-4 4 4"></path><path d="M8 11H6a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-2"></path></svg></button>

</div>

<div style="display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; flex-wrap: wrap; gap: 6px;">
<span style="display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 999px; background: #EAF2FB; color: #005AAA; font-size: 13px;"><span style="width: 6px; height: 6px; border-radius: 3px; background: #005AAA;"></span>очно</span>
<span style="height: 26px; display: inline-flex; align-items: center; padding: 0 10px; border-radius: 999px; background: #F4F7FB; color: #4A515C; font-size: 13px;">#хакатон</span>
<span style="height: 26px; display: inline-flex; align-items: center; padding: 0 10px; border-radius: 999px; background: #F4F7FB; color: #4A515C; font-size: 13px;">#web</span>
</div>
<h1 style="margin: 0; font-size: 26px; line-height: 32px; font-weight: 700; color: #005AAA;">Хакатон «Цифровой кампус»</h1>
</div>

<div style="border-radius: 16px; background: #ffffff; box-shadow: 0 1px 2px rgba(0, 40, 90, 0.06), 0 4px 14px rgba(0, 40, 90, 0.06); display: flex; flex-direction: column;">

<div style="height: 1px; background: #EEF1F5; margin: 0 16px;"></div>
<div style="display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#005AAA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px;"><path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 2.5-1.3 5-2.8 7"></path><circle cx="12" cy="10" r="2.5"></circle></svg><div style="display: flex; flex-direction: column; gap: 2px;"><div style="font-size: 15px;">Б. Морская, 67 · ауд. 22-12</div><div style="font-size: 13px; font-weight: 300; color: #5E6673;">Вход по студенческому</div></div></div>
<div style="height: 1px; background: #EEF1F5; margin: 0 16px;"></div>
<div style="display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#005AAA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px;"><path d="M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"></path><path d="M3 19a6 6 0 0 1 10-4.5"></path><path d="M16 5.5a3 3 0 0 1 0 5.5"></path><path d="M17 15a6 6 0 0 1 4 4"></path></svg><div style="display: flex; flex-direction: column; gap: 2px;"><div style="font-size: 15px;">Команды 2–4 человека</div><div style="font-size: 13px; font-weight: 300; color: #5E6673;">Организатор: [название организатора]</div></div></div>
</div>

<section style="display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; align-items: center; gap: 10px;"><div style="width: 4px; height: 20px; border-radius: 2px; background: linear-gradient(to top, #005AAA, #AB3A8D);"></div><h2 style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 700; color: #005AAA;">О мероприятии</h2></div>
<div style="display: flex; flex-direction: column; gap: 12px; font-size: 16px; line-height: 24px; font-weight: 300;">
<p style="margin: 0;">Два дня, чтобы придумать и собрать сервис, который сделает жизнь в университете удобнее: навигация по корпусам, запись в библиотеку, обмен конспектами — выбирайте сами.</p>
<h3 style="margin: 4px 0 0; font-size: 16px; line-height: 22px; font-weight: 400; color: #2B2F36;">Что будет</h3>
<div style="display: flex; gap: 10px;"><span style="width: 6px; height: 6px; border-radius: 3px; background: #005AAA; margin-top: 9px; flex-shrink: 0;"></span><span>менторы из IT-компаний и разбор проектов;</span></div>
<div style="display: flex; gap: 10px;"><span style="width: 6px; height: 6px; border-radius: 3px; background: #005AAA; margin-top: 9px; flex-shrink: 0;"></span><span>питание и место для ночёвки для тех, кто остаётся;</span></div>
<div style="display: flex; gap: 10px;"><span style="width: 6px; height: 6px; border-radius: 3px; background: #005AAA; margin-top: 9px; flex-shrink: 0;"></span><span>призы для трёх лучших команд.</span></div>
<p style="margin: 0;">Подробности и правила — на <a href="#" style="color: #005AAA; text-decoration: underline; text-underline-offset: 3px;">странице хакатона</a>.</p>
</div>
</section>
</main>
