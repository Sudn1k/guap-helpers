<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карточка · сложно — прототип</title>
<link rel="icon" href="../img/app-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&amp;display=swap">
<link rel="stylesheet" href="../css/app.css">
</head>
<body class="proto">
<a class="proto-back" href="../index.html">← Все экраны</a>
<div class="device" id="app"></div>
<template id="tpl-TeacherDetail-Hard">
<div style="width: 390px; height: 844px; overflow: hidden; background: #ffffff;">
<dc-import name="TeacherDetail" teacher="Кузнецов" screen-height="844" hint-size="390px,844px"></dc-import>
</div>
</template>
<template id="tpl-TeacherDetail">
<div style="width: 390px; height: {{screenHeight}}px; overflow: hidden; background: #ffffff; font-family: 'Roboto', Arial, sans-serif; color: #2B2F36; display: flex; flex-direction: column;">

<header style="flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 8px 12px 0 8px;">
<a href="Teachers.html" style="height: 44px; padding: 0 8px 0 0; display: inline-flex; align-items: center; gap: 2px; color: #005AAA; font-size: 16px; text-decoration: none;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Преподаватели</a>
<a href="Notifications.html" aria-label="Уведомления, 3 непрочитанных" style="position: relative; width: 44px; height: 44px; border-radius: 12px; background: #F4F7FB; color: #005AAA; display: flex; align-items: center; justify-content: center; text-decoration: none;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13.5V10a6 6 0 0 0-12 0v6l-1.5 2h15"></path><path d="M10 21h4"></path></svg><span style="position: absolute; top: 4px; right: 3px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: #E70F47; color: #ffffff; font-size: 11px; font-weight: 700; line-height: 14px; text-align: center; border: 2px solid #ffffff;">3</span></a>
</header>

<main style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 12px 20px 24px; display: flex; flex-direction: column; gap: 20px;">

<div style="display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; align-items: center; gap: 14px;">
<span style="width: 64px; height: 64px; border-radius: 32px; background: #EAF2FB; color: #005AAA; font-size: 22px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">{{initials}}</span>
<h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700; color: #005AAA;">{{name}}</h1>
</div>
<div style="font-size: 14px; line-height: 20px; font-weight: 300; color: #4A515C;"><span style="font-weight: 400; color: #2B2F36;">Также:</span> {{aka}}</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px;">
<sc-for list="{{subjects}}" as="s" hint-placeholder-count="2"><span style="display: inline-flex; align-items: center; height: 28px; padding: 0 12px; border-radius: 999px; background: #F4F7FB; color: #2B2F36; font-size: 14px;">{{s}}</span></sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 16px; background: {{diffBg}};">
<div style="display: flex; align-items: center; justify-content: space-between;"><span style="font-size: 14px; color: #4A515C;">Сложность по мнению студентов</span><span style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 999px; background: #ffffff; color: {{diffColor}}; font-size: 14px;"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{diffDot}};"></span>{{diff}}</span></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;">
<sc-for list="{{scale}}" as="sc" hint-placeholder-count="3"><div style="display: flex; flex-direction: column; gap: 6px;"><div style="height: 6px; border-radius: 3px; background: {{sc.color}};"></div><span style="font-size: 12px; color: {{sc.labelColor}};">{{sc.label}}</span></div></sc-for>
</div>
</div>

<section style="display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; align-items: center; gap: 10px;"><div style="width: 4px; height: 20px; border-radius: 2px; background: linear-gradient(to top, #005AAA, #AB3A8D);"></div><h2 style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 700; color: #005AAA;">Заметки</h2></div>
<div style="border-radius: 16px; background: #ffffff; box-shadow: 0 1px 2px rgba(0, 40, 90, 0.06), 0 4px 14px rgba(0, 40, 90, 0.06); display: flex; flex-direction: column;">
<sc-for list="{{notes}}" as="nt" hint-placeholder-count="4">
<div style="display: flex; gap: 12px; padding: 14px 16px; border-top: {{nt.border}};">
<span style="width: 6px; height: 6px; border-radius: 3px; background: #005AAA; margin-top: 8px; flex-shrink: 0;"></span>
<div style="display: flex; flex-direction: column; gap: 3px;"><span style="font-size: 13px; color: #5E6673;">{{nt.label}}</span><span style="font-size: 16px; line-height: 23px; font-weight: 300;">{{nt.text}}</span></div>
</div>
</sc-for>
</div>
</section>

<a href="Schedule.html" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; background: #F2F7FD; border: 1px solid #CFE0F3; text-decoration: none; color: inherit;">
<span style="width: 40px; height: 40px; border-radius: 12px; background: #ffffff; color: #005AAA; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12.5V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h8"></path><path d="M17.5 20h.5a2 2 0 0 0 2-2v-1.5"></path><path d="M8 3v4M16 3v4M4 10h16"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 13px; color: #005AAA;">Ближайшая пара</span><span style="font-size: 15px; line-height: 20px;">{{nextLesson}}</span></span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5E6673" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>

<div style="display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-radius: 12px; background: #F4F7FB;">
<div style="display: flex; align-items: flex-start; gap: 10px; font-size: 14px; line-height: 19px; color: #2B2F36;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E6673" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M20 12a8 8 0 1 0-8 8"></path><path d="M12 11v5"></path><path d="M12 8h.01"></path></svg>Субъективное мнение студентов, не официальная информация</div>
<div style="font-size: 12px; line-height: 16px; color: #5E6673; padding-left: 28px;">Источник: Telegram-бот [название] · обновлено 12 сентября</div>
</div>
</main>

<nav aria-label="Основная навигация" style="flex-shrink: 0; height: 84px; box-sizing: border-box; padding: 6px 4px 20px; display: flex; background: #ffffff; border-top: 1px solid #E3E8EF; box-shadow: 0 -2px 16px rgba(0, 40, 90, 0.06);">
<a href="Main.html" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5E6673; min-height: 52px;"><span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"></path><path d="M6 13.5V20h4v-5h4v5h4v-6.5"></path></svg></span><span style="font-size: 12px; font-weight: 400;">Главная</span></a>
<a href="Schedule.html" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5E6673; min-height: 52px;"><span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12.5V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h8"></path><path d="M17.5 20h.5a2 2 0 0 0 2-2v-1.5"></path><path d="M8 3v4M16 3v4M4 10h16"></path></svg></span><span style="font-size: 12px; font-weight: 400;">Расписание</span></a>
<a href="Tasks.html" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5E6673; min-height: 52px;"><span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7l2 2 3.5-3.5"></path><path d="M4 16.5l2 2L9.5 15"></path><path d="M13 7.5h7M13 17h7"></path></svg></span><span style="font-size: 12px; font-weight: 400;">Задания</span></a>
<a href="Topics.html" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5E6673; min-height: 52px;"><span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 14.5V21l-6-4-6 4V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v5.5"></path></svg></span><span style="font-size: 12px; font-weight: 400;">Темы</span></a>
<a href="More.html" aria-current="page" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #005AAA; min-height: 52px;"><span style="width: 56px; height: 30px; border-radius: 15px; background: #EAF2FB; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1.5"></rect><rect x="14" y="4" width="6" height="6" rx="1.5"></rect><rect x="4" y="14" width="6" height="6" rx="1.5"></rect><path d="M14 17h6M17 14v6"></path></svg></span><span style="font-size: 12px; font-weight: 400;">Ещё</span></a>
</nav>
</div>
</template>
<script src="../js/dc-lite.js"></script>
<script src="../js/components/TeacherDetail-Hard.js"></script>
<script src="../js/components/TeacherDetail.js"></script>
<script>DCLite.mount("TeacherDetail-Hard", document.getElementById('app'), {});</script>
</body>
</html>
